<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Restoration Map — Wholesome Empire YYC</title>
<meta name="description" content="Map your starting point for scar revision, camouflage, scalp micropigmentation, or brows. A private treatment-path assessment." />
<meta name="robots" content="index,follow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   THE RESTORATION MAP — Wholesome Empire YYC (design concept B)
   Black editorial shell, warm clinic-file interior, topographic healing lines.
   Reuses the tested engine in /tools/wholesome/*. Tokens namespaced --rm-*.
   ========================================================================== */
:root{
  --rm-ink:#0B0B0A; --rm-white:#F6F3EE; --rm-paper:#ECE7DE; --rm-grey:#D8D6D0;
  --rm-charcoal:#1B1B18; --rm-olive:#3E4938; --rm-sage:#DDE4D8; --rm-clay:#A46F55;
  --rm-blush:#D7B7A9;
  --rm-line:rgba(27,27,24,.16); --rm-line-2:rgba(27,27,24,.30);
  --rm-line-dark:rgba(246,243,238,.16);
  --rm-fdisplay:"Oswald","Helvetica Neue",Arial,sans-serif;
  --rm-fbody:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rm-fmono:"Space Mono",ui-monospace,Menlo,monospace;
  --rm-ease:cubic-bezier(.2,.7,.2,1);
  --rm-maxw:1120px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{ background:var(--rm-ink); color:var(--rm-white); font-family:var(--rm-fbody); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
img{max-width:100%;display:block}
button{font-family:inherit}

/* full-page topographic watermark on the black shell */
#rm-contours{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#rm-contours svg{ position:absolute; }

/* --- header (black editorial) ------------------------------------------- */
.rm-head{ position:relative; z-index:3; border-bottom:1px solid var(--rm-line-dark); }
.rm-head__in{ max-width:var(--rm-maxw); margin:0 auto; padding:20px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.rm-brand{ display:flex; align-items:center; gap:11px; font-family:var(--rm-fdisplay); font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:17px; color:var(--rm-white); text-decoration:none; }
.rm-brand .dot{ width:9px;height:9px;border-radius:50%;background:var(--rm-sage); box-shadow:0 0 12px 1px rgba(221,228,216,.5); }
.rm-head__meta{ font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:rgba(246,243,238,.6); }
@media(max-width:640px){ .rm-head__meta{ display:none } }

/* --- map strip (progress) ----------------------------------------------- */
.rm-strip{ position:relative; z-index:3; border-bottom:1px solid var(--rm-line-dark); background:rgba(11,11,10,.6); }
.rm-strip__in{ max-width:var(--rm-maxw); margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:8px; overflow-x:auto; }
.rm-step{ display:flex; align-items:center; gap:9px; font-family:var(--rm-fmono); font-weight:700; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:rgba(246,243,238,.5); white-space:nowrap; }
.rm-step__n{ font-weight:700; }
.rm-step.is-active{ color:var(--rm-white); }
.rm-step.is-done{ color:var(--rm-sage); }
.rm-step .tick{ color:var(--rm-sage); }
.rm-step__sep{ flex:none; width:22px; height:1px; background:var(--rm-line-dark); }
@media(max-width:640px){ .rm-strip__in{ padding:12px 20px } .rm-step__sep{ width:12px } .rm-step{ font-size:10px } }

/* --- layout shell -------------------------------------------------------- */
.rm-main{ position:relative; z-index:2; max-width:var(--rm-maxw); margin:0 auto; padding:0 28px; }
.rm-grid{ display:grid; grid-template-columns:1fr 300px; gap:34px; align-items:start; padding:44px 0 64px; }
.rm-grid.is-full{ grid-template-columns:1fr; }
@media(max-width:860px){ .rm-grid{ grid-template-columns:1fr; gap:20px; padding:26px 0 48px } }

.rm-stage{ min-height:52vh; animation:rm-in 460ms var(--rm-ease) both; }
@keyframes rm-in{ from{opacity:0; transform:translateY(16px)} to{opacity:1;transform:none} }
@keyframes rm-rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1;transform:none} }
@media(prefers-reduced-motion:reduce){ .rm-stage,.rm-card,.rm-stagger>*{animation:none!important} }

/* --- eyebrow / headings -------------------------------------------------- */
.rm-eyebrow{ font-family:var(--rm-fmono); font-weight:700; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--rm-clay); margin:0 0 16px; }
.rm-kicker{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; font-size:clamp(15px,2.6vw,24px); letter-spacing:.2em; color:var(--rm-clay); white-space:nowrap; margin:0 0 14px; }
.rm-h1{ font-family:var(--rm-fdisplay); font-weight:700; text-transform:uppercase; font-size:clamp(44px,8vw,84px); line-height:.94; letter-spacing:.005em; color:var(--rm-white); margin:0 0 22px; }
.rm-h2{ font-family:var(--rm-fdisplay); font-weight:500; text-transform:uppercase; font-size:clamp(26px,4.4vw,40px); line-height:1.02; letter-spacing:.01em; color:var(--rm-white); margin:0 0 10px; }
.rm-sub{ color:rgba(246,243,238,.66); font-size:17px; line-height:1.6; max-width:40ch; margin:0 0 30px; }
.rm-help{ font-family:var(--rm-fmono); font-weight:700; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:rgba(246,243,238,.6); margin:0 0 26px; }

/* --- welcome ------------------------------------------------------------- */
.rm-welcome{ display:grid; grid-template-columns:1.3fr .9fr; gap:40px; align-items:center; }
@media(max-width:860px){ .rm-welcome{ grid-template-columns:1fr; gap:26px } }
.rm-filecard{ position:relative; border:1px solid var(--rm-line-dark); border-radius:6px; background:linear-gradient(160deg, rgba(62,73,56,.28), rgba(11,11,10,.2)); padding:26px; overflow:hidden; aspect-ratio:1/1.12; display:flex; flex-direction:column; justify-content:space-between; }
.rm-filecard__tag{ font-family:var(--rm-fmono); font-weight:700; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--rm-sage); }
.rm-filecard__top{ display:flex; justify-content:space-between; gap:12px; }
.rm-filerows{ display:flex; flex-direction:column; margin:auto 0; }
.rm-filerow{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:13px 0; border-bottom:1px solid var(--rm-line-dark); font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
.rm-filerow:last-child{ border-bottom:none; }
.rm-filerow>span:first-child{ color:rgba(246,243,238,.42); }
.rm-filerow>span:last-child{ color:var(--rm-sage); }
.rm-filestamp{ align-self:flex-start; font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--rm-clay); border:1.5px solid var(--rm-clay); border-radius:3px; padding:7px 12px; transform:rotate(-3deg); }
.rm-btn{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; letter-spacing:.1em; font-size:15px; cursor:pointer; border:none; border-radius:2px; padding:17px 34px; background:var(--rm-white); color:var(--rm-ink); transition:background 180ms var(--rm-ease), transform 120ms var(--rm-ease); display:inline-flex; align-items:center; gap:12px; text-decoration:none; }
.rm-btn:hover{ background:var(--rm-sage); }
.rm-btn:active{ transform:translateY(1px); }
.rm-btn--olive{ background:var(--rm-olive); color:var(--rm-white); }
.rm-btn--olive:hover{ background:#4a5744; }
.rm-btn--full{ width:100%; justify-content:center; }
.rm-privacy{ display:flex; align-items:center; gap:8px; font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:rgba(246,243,238,.55); margin:18px 0 0; }

/* --- path cards ---------------------------------------------------------- */
.rm-cards{ display:flex; flex-direction:column; gap:12px; }
.rm-cards--grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:560px){ .rm-cards--grid{ grid-template-columns:1fr } }
.rm-pathcard{ position:relative; text-align:left; cursor:pointer; background:var(--rm-paper); color:var(--rm-charcoal); border:1px solid var(--rm-line); border-radius:5px; padding:20px 22px; overflow:hidden; transition:transform 160ms var(--rm-ease), border-color 160ms var(--rm-ease), box-shadow 200ms var(--rm-ease); }
.rm-pathcard:hover{ transform:translateY(-2px); border-color:var(--rm-olive); box-shadow:0 14px 34px -22px rgba(0,0,0,.8); }
.rm-pathcard:focus-visible{ outline:2px solid var(--rm-olive); outline-offset:2px; }
.rm-pathcard.is-selected{ border-color:var(--rm-olive); box-shadow:inset 0 0 0 1px var(--rm-olive); background:#f0ede5; }
.rm-pathcard__n{ font-family:var(--rm-fmono); font-size:12.5px; font-weight:700; letter-spacing:.12em; color:var(--rm-clay); }
.rm-pathcard__t{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; font-size:19px; line-height:1.08; letter-spacing:.01em; margin:5px 0 0; color:var(--rm-charcoal); }
.rm-pathcard__d{ font-size:13.5px; line-height:1.5; color:rgba(27,27,24,.62); margin:7px 0 0; }
.rm-pathcard__lines{ position:absolute; right:-30px; top:-20px; width:170px; height:170px; opacity:0; transition:opacity 320ms var(--rm-ease); pointer-events:none; }
.rm-pathcard.is-selected .rm-pathcard__lines{ opacity:.18; }
.rm-stamp{ position:absolute; top:14px; right:14px; font-family:var(--rm-fmono); font-weight:700; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--rm-olive); border:1.5px solid var(--rm-olive); border-radius:3px; padding:4px 8px; transform:rotate(-4deg) scale(.6); opacity:0; transition:all 260ms var(--rm-ease); }
.rm-pathcard.is-selected .rm-stamp{ opacity:1; transform:rotate(-4deg) scale(1); }

/* --- timeline (for the timeline screen) --------------------------------- */
.rm-timeline{ position:relative; padding:26px 6px 60px; }
.rm-tl-track{ position:absolute; left:14px; right:14px; top:36px; height:2px; background:var(--rm-line-dark); }
.rm-tl-nodes{ position:relative; display:flex; justify-content:space-between; }
.rm-tl-node{ background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:16px; padding:0; width:20%; }
.rm-tl-dot{ width:20px;height:20px;border-radius:50%; background:var(--rm-ink); border:2px solid rgba(246,243,238,.35); transition:all 200ms var(--rm-ease); }
.rm-tl-node:hover .rm-tl-dot{ border-color:var(--rm-sage); }
.rm-tl-node.is-selected .rm-tl-dot{ background:var(--rm-sage); border-color:var(--rm-sage); box-shadow:0 0 14px rgba(221,228,216,.6); transform:scale(1.15); }
.rm-tl-lab{ font-family:var(--rm-fmono); font-weight:700; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:rgba(246,243,238,.78); text-align:center; line-height:1.25; }
.rm-tl-node.is-selected .rm-tl-lab{ color:var(--rm-white); }
@media(max-width:640px){ .rm-tl-lab{ font-size:11px } }

/* --- map so far (sidebar / drawer) -------------------------------------- */
.rm-map{ position:sticky; top:20px; border:1px solid var(--rm-line-dark); border-radius:6px; background:rgba(20,20,18,.5); overflow:hidden; }
.rm-map>summary{ list-style:none; cursor:default; padding:16px 20px; font-family:var(--rm-fmono); font-weight:700; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--rm-sage); border-bottom:1px solid var(--rm-line-dark); display:flex; align-items:center; justify-content:space-between; }
.rm-map>summary::-webkit-details-marker{ display:none; }
.rm-map__caret{ display:none; }
.rm-map__body{ padding:6px 20px 18px; }
.rm-maprow{ padding:13px 0; border-bottom:1px solid var(--rm-line-dark); animation:rm-rise 400ms var(--rm-ease) both; }
.rm-maprow:last-child{ border-bottom:none; }
.rm-maprow__k{ font-family:var(--rm-fmono); font-weight:700; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:rgba(246,243,238,.55); }
.rm-maprow__v{ font-size:14.5px; color:var(--rm-white); margin-top:3px; line-height:1.35; }
.rm-maprow__v.olive{ color:var(--rm-sage); font-family:var(--rm-fdisplay); text-transform:uppercase; letter-spacing:.02em; }
.rm-map__empty{ font-size:13px; color:rgba(246,243,238,.4); padding:10px 0; }
@media(max-width:860px){
  .rm-map{ position:static; order:-1; }
  .rm-map>summary{ cursor:pointer; }
  .rm-map__caret{ display:inline; transition:transform 200ms var(--rm-ease); }
  .rm-map:not([open]) .rm-map__caret{ transform:rotate(-90deg); }
}

/* --- contact ------------------------------------------------------------- */
.rm-field{ margin:0 0 16px; }
.rm-label{ display:block; font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(246,243,238,.68); margin:0 0 7px; }
.rm-input{ width:100%; padding:14px 16px; font-size:16px; font-family:inherit; color:var(--rm-white); background:rgba(0,0,0,.3); border:1px solid var(--rm-line-dark); border-radius:3px; }
.rm-input:focus{ outline:none; border-color:var(--rm-sage); }
.rm-check{ display:flex; align-items:flex-start; gap:11px; margin:8px 0; cursor:pointer; }
.rm-check input{ margin-top:3px; width:17px;height:17px; accent-color:var(--rm-olive); flex:none; }
.rm-check span{ font-size:13.5px; color:rgba(246,243,238,.72); line-height:1.5; }
.rm-err{ color:#e0a08b; font-size:13px; min-height:1px; margin:6px 0 0; }

/* --- building transition ------------------------------------------------- */
.rm-building{ min-height:56vh; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; }
.rm-building__t{ font-family:var(--rm-fmono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--rm-clay); margin:0 0 22px; }
.rm-building__step{ font-family:var(--rm-fdisplay); font-weight:500; text-transform:uppercase; font-size:clamp(20px,3.4vw,28px); color:rgba(246,243,238,.3); margin:0 0 12px; transition:color 400ms var(--rm-ease); display:flex; align-items:center; gap:14px; }
.rm-building__step.is-on{ color:var(--rm-white); }
.rm-building__step .tick{ color:var(--rm-sage); font-family:var(--rm-fmono); font-size:16px; opacity:0; transition:opacity 300ms var(--rm-ease); }
.rm-building__step.is-on .tick{ opacity:1; }

/* --- report (warm clinic file) ------------------------------------------ */
.rm-report{ background:var(--rm-paper); color:var(--rm-charcoal); border-radius:8px; overflow:hidden; box-shadow:0 40px 90px -50px rgba(0,0,0,.9); animation:rm-in 520ms var(--rm-ease) both; }
.rm-report__head{ position:relative; background:var(--rm-charcoal); color:var(--rm-white); padding:30px 34px; overflow:hidden; }
.rm-report__lines{ position:absolute; inset:0; opacity:.14; pointer-events:none; }
.rm-report__ey{ font-family:var(--rm-fmono); font-weight:700; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--rm-sage); position:relative; }
.rm-report__ttl{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; font-size:clamp(28px,5vw,44px); line-height:1; margin:10px 0 16px; position:relative; }
.rm-report__ids{ display:flex; gap:26px; flex-wrap:wrap; position:relative; }
.rm-report__id{ font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:rgba(246,243,238,.68); }
.rm-report__id b{ color:var(--rm-white); font-weight:700; }
.rm-report__body{ padding:30px 34px 36px; }
@media(max-width:560px){ .rm-report__head,.rm-report__body{ padding-left:22px; padding-right:22px } }

.rm-block{ padding:24px 0; border-top:1px solid var(--rm-line); }
.rm-block:first-child{ border-top:none; padding-top:8px; }
.rm-mono{ font-family:var(--rm-fmono); font-weight:700; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:rgba(27,27,24,.62); margin:0 0 12px; }
.rm-mono b{ color:var(--rm-charcoal); font-weight:700; }
.rm-path{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; font-size:clamp(24px,4.4vw,34px); line-height:1.04; color:var(--rm-charcoal); margin:0; }
.rm-body{ font-size:15.5px; line-height:1.66; color:rgba(27,27,24,.82); margin:0; }
.rm-badge{ display:inline-flex; align-items:center; gap:9px; font-family:var(--rm-fmono); font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase; padding:10px 16px; border-radius:3px; border:1.5px solid; transform:rotate(-1.5deg); }
.rm-badge[data-b="Ready for consult"]{ color:var(--rm-olive); border-color:var(--rm-olive); background:var(--rm-sage); }
.rm-badge[data-b="Photo review recommended"]{ color:var(--rm-white); border-color:var(--rm-charcoal); background:var(--rm-charcoal); }
.rm-badge[data-b="Wait and prepare"]{ color:#5a3a29; border-color:var(--rm-clay); background:#eaddd4; }
.rm-badge[data-b="Specialist review recommended"]{ color:var(--rm-white); border-color:var(--rm-ink); background:var(--rm-ink); }
.rm-badge[data-b="Education first"]{ color:#3a3a35; border-color:#9a978d; background:var(--rm-grey); }
.rm-checkgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 22px; margin:4px 0 0; }
@media(max-width:520px){ .rm-checkgrid{ grid-template-columns:1fr } }
.rm-checkgrid li{ list-style:none; display:flex; align-items:flex-start; gap:10px; font-size:14.5px; color:var(--rm-charcoal); }
.rm-checkgrid li::before{ content:"✓"; color:var(--rm-olive); font-weight:700; }
.rm-prep{ list-style:none; margin:4px 0 0; padding:0; display:grid; gap:11px; }
.rm-prep li{ display:flex; align-items:flex-start; gap:12px; font-size:15px; color:var(--rm-charcoal); }
.rm-prep li::before{ content:""; flex:none; width:15px; height:15px; margin-top:2px; border:1.5px solid var(--rm-olive); border-radius:3px; }
.rm-report__sub{ font-family:var(--rm-fbody); font-size:15px; color:rgba(246,243,238,.72); margin:0 0 18px; max-width:46ch; position:relative; }
.rm-body b{ color:var(--rm-charcoal); font-weight:600; }
.rm-qs{ list-style:none; margin:6px 0 0; padding:0; display:grid; gap:11px; }
.rm-qs li{ display:flex; align-items:flex-start; gap:11px; font-size:15px; line-height:1.5; color:var(--rm-charcoal); }
.rm-qs li::before{ content:"?"; font-family:var(--rm-fmono); font-weight:700; color:var(--rm-clay); flex:none; }
.rm-next{ background:var(--rm-charcoal); color:var(--rm-white); border-radius:6px; padding:24px 24px; }
.rm-next .rm-mono{ color:rgba(246,243,238,.5); }
.rm-next .rm-mono b{ color:var(--rm-white); }
.rm-next__h{ font-family:var(--rm-fdisplay); font-weight:600; text-transform:uppercase; font-size:22px; margin:0 0 7px; }
.rm-next__d{ font-size:14.5px; color:rgba(246,243,238,.72); margin:0 0 18px; }
.rm-fear{ background:var(--rm-sage); border-radius:6px; padding:20px 22px; }
.rm-fear .rm-mono{ color:var(--rm-olive); }
.rm-fear p{ margin:8px 0 0; font-size:15.5px; line-height:1.62; color:rgba(30,40,30,.9); }
.rm-cta-row{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.rm-btn--ghostlight{ background:transparent; color:var(--rm-white); border:1px solid rgba(246,243,238,.35); }
.rm-btn--ghostlight:hover{ background:transparent; border-color:var(--rm-sage); color:var(--rm-sage); }
.rm-disc{ font-size:12px; line-height:1.55; color:rgba(27,27,24,.5); border-left:2px solid var(--rm-line); padding:2px 0 2px 14px; margin:22px 0 0; }
.rm-stagger>*{ animation:rm-rise 560ms var(--rm-ease) both; }

/* --- when-picker (scar start) + days calculator ------------------------- */
.rm-when{ display:flex; flex-direction:column; gap:16px; max-width:520px; }
.rm-when__or{ display:flex; align-items:center; gap:14px; font-family:var(--rm-fmono); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:rgba(246,243,238,.5); }
.rm-when__or::before,.rm-when__or::after{ content:""; flex:1; height:1px; background:var(--rm-line-dark); }
.rm-when__year{ width:100%; padding:16px 18px; font-family:var(--rm-fbody); font-size:16px; color:var(--rm-white); background:rgba(0,0,0,.3) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23DDE4D8' stroke-width='1.6'/></svg>") no-repeat right 18px center; border:1px solid var(--rm-line-dark); border-radius:5px; appearance:none; -webkit-appearance:none; cursor:pointer; }
.rm-when__year:focus{ outline:none; border-color:var(--rm-sage); }
.rm-when__unsure{ align-self:flex-start; cursor:pointer; font-family:var(--rm-fbody); font-size:14px; color:rgba(246,243,238,.55); background:none; border:none; padding:2px; text-decoration:underline; text-underline-offset:3px; }
.rm-when__unsure:hover{ color:var(--rm-sage); }

.rm-spin{ display:inline-block; width:14px;height:14px; border:2px solid rgba(11,11,10,.3); border-top-color:var(--rm-ink); border-radius:50%; animation:rm-spin .7s linear infinite; }
@keyframes rm-spin{ to{ transform:rotate(360deg) } }

</head>
<body>
<div id="rm-contours"></div>

<header class="rm-head">
  <div class="rm-head__in">
    <a class="rm-brand" href="/"><span class="dot"></span>Wholesome Empire</a>
    <span class="rm-head__meta">Private Treatment Path Assessment</span>
  </div>
</header>

<div class="rm-strip"><div class="rm-strip__in" id="strip"></div></div>

<main class="rm-main">
  <div class="rm-grid is-full" id="grid">
    <section class="rm-stage" id="stage"></section>
    <details class="rm-map rm-hidden" id="map" open>
      <summary>Your map so far <span class="rm-map__caret">▾</span></summary>
      <div class="rm-map__body" id="mapBody"></div>
    </details>
  </div>
</main>

<footer class="rm-foot">Wholesome Empire YYC · General guidance only · A specialist confirms whether treatment is appropriate</footer>

<script type="module">
import { assess } from '/tools/wholesome/assessment.js';
import { SCREENS, flowFor, REPORT, FLAG_LABELS, DISCLAIMER, LETTER, DAYS_COPY, personalSummary } from '/tools/wholesome/content.js';

// ---- config (swap for the clinic's real details before launch) ----
const CONFIG = {
  site: 'https://www.wholesomeempireyyc.com',
  bookingUrl: 'https://www.wholesomeempireyyc.com/contact',   // their Inquire / Free Phone Consult funnel
  prepGuideUrl: '',                                           // [TODO: prep-guide page/PDF, if they make one]
  treatmentUrls: {
    revision: 'https://www.wholesomeempireyyc.com/scars-stretch-marks-calgary',
    camouflage: 'https://www.wholesomeempireyyc.com/scars-stretch-marks-calgary',
    smp: 'https://www.wholesomeempireyyc.com/smp-micropigmentation-calgary',
    brow: 'https://www.wholesomeempireyyc.com/powderbrows-calgary',
    match: 'https://www.wholesomeempireyyc.com/services',
  },
};
const treatmentUrl = (fam) => CONFIG.treatmentUrls[fam] || CONFIG.site;
function ctaHref(nextStepId, fam) {
  if (nextStepId === 'learn_more') return treatmentUrl(fam);
  if (nextStepId === 'wait_prepare') return CONFIG.prepGuideUrl || treatmentUrl(fam);
  return CONFIG.bookingUrl || treatmentUrl(fam); // consult + photo review -> inquiry funnel
}
const extAttr = (h) => (/^https?:/.test(h) ? ' target="_blank" rel="noopener"' : '');

// ---- session ----
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
let sessionId = sessionStorage.getItem('rm_sid') || uuid();
sessionStorage.setItem('rm_sid', sessionId);
const utmSource = new URLSearchParams(location.search).get('utm_source');
const referrer = document.referrer || null;
let submissionId = null;
// short, stable "case number" derived from the session
const pathId = 'WE-' + (parseInt(sessionId.replace(/[^0-9a-f]/g, '').slice(0, 6), 16) % 9000 + 1000);

function track(event_type, metadata) {
  try {
    fetch('/api/wholesome-event', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, event_type, metadata: { ...metadata, design: 'restoration_map' } }), keepalive: true });
  } catch (_) {}
}

// ---- topographic contour generator (the signature motif) ----
function contour(w, h, cx, cy, rings, baseR, step, color, sw = 1) {
  let p = '';
  for (let k = 0; k < rings; k++) {
    const R = baseR + k * step, N = 60, pts = [];
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      const noise = Math.sin(a * 3 + k * .55) * step * .30 + Math.sin(a * 5 + k * 1.3) * step * .16 + Math.sin(a * 2 - k) * step * .12;
      const r = R + noise;
      pts.push([(cx + Math.cos(a) * r).toFixed(1), (cy + Math.sin(a) * r * .86).toFixed(1)]);
    }
    p += `<path d="M${pts.map(q => q.join(' ')).join(' L')} Z" fill="none" stroke="${color}" stroke-width="${sw}"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">${p}</svg>`;
}
// page watermark
document.getElementById('rm-contours').innerHTML =
  `<div style="position:absolute;right:-14vw;top:-6vh;opacity:.5">${contour(760, 760, 380, 380, 13, 40, 26, 'rgba(221,228,216,0.11)')}</div>` +
  `<div style="position:absolute;left:-18vw;bottom:-16vh;opacity:.45">${contour(680, 680, 340, 340, 11, 34, 27, 'rgba(164,111,85,0.10)')}</div>`;

// ---- state ----
const answers = {};
let $stage = document.getElementById('stage');
const $strip = document.getElementById('strip');
const $grid = document.getElementById('grid');
const $map = document.getElementById('map');
const $mapBody = document.getElementById('mapBody');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const labelOf = (sid, oid) => { const s = SCREENS[sid]; const o = s && s.options.find(x => x.id === oid); return o ? o.label : ''; };

function paint(html, cls = '') {
  const fresh = $stage.cloneNode(false); fresh.className = 'rm-stage ' + cls; fresh.innerHTML = html;
  $stage.parentElement.replaceChild(fresh, $stage); $stage = fresh; return fresh;
}

// ---- progress strip ----
const STAGES = [['01', 'Concern'], ['02', 'Goal'], ['03', 'Timeline'], ['04', 'Details'], ['05', 'Report']];
function stageIndex(screenId) {
  if (screenId === 'concern' || screenId === 'welcome') return 0;
  if (/^goal_/.test(screenId)) return 1;
  if (screenId === 'timeline') return 2;
  if (screenId === 'contact' || screenId === 'building' || screenId === 'report') return 4;
  return 3; // readiness + barrier
}
function renderStrip(activeIdx) {
  $strip.innerHTML = STAGES.map((s, i) => {
    const cls = i < activeIdx ? 'is-done' : i === activeIdx ? 'is-active' : '';
    const mark = i < activeIdx ? '<span class="tick">✓</span>' : `<span class="rm-step__n">${s[0]}</span>`;
    return `<span class="rm-step ${cls}">${mark}${esc(s[1])}</span>` + (i < STAGES.length - 1 ? '<span class="rm-step__sep"></span>' : '');
  }).join('');
}

// ---- "your map so far" ----
function updateMap() {
  const rows = [];
  if (answers.concern) rows.push(['Concern', CONCERN_LABEL[answers.concern] || labelOf('concern', answers.concern)]);
  const goalKey = 'goal_' + (answers.concern || '');
  if (answers[goalKey]) rows.push(['Goal', labelOf(goalKey, answers[goalKey])]);
  if (answers.timeline) rows.push(['Timeline', labelOf('timeline', answers.timeline)]);
  let likely = null;
  if (answers.concern && answers[goalKey]) { try { likely = assess(answers).bestFitPath; } catch (_) {} }
  const body = rows.map(r => `<div class="rm-maprow"><div class="rm-maprow__k">${esc(r[0])}</div><div class="rm-maprow__v">${esc(r[1])}</div></div>`).join('')
    + (likely ? `<div class="rm-maprow"><div class="rm-maprow__k">Likely path</div><div class="rm-maprow__v olive">${esc(likely)}</div></div>` : '');
  $mapBody.innerHTML = body || '<p class="rm-map__empty">Your answers will appear here as we map your path.</p>';
}
function showMap(on) { $map.classList.toggle('rm-hidden', !on); $grid.classList.toggle('is-full', !on); }

// ---- concern (custom path cards) ----
const CONCERN_CARDS = [
  { id: 'scars', n: '01', t: 'Skin: Scars + Stretch Marks', d: 'Texture, colour, raised or uneven skin' },
  { id: 'smp', n: '02', t: 'Scalp + Hairline', d: 'Density, hairline, crown, or scalp scars' },
  { id: 'brows', n: '03', t: 'Brows', d: 'Shape, fullness, definition, old brow work' },
  { id: 'unsure', n: '04', t: 'Not Sure Yet', d: 'Start broad and get guided' },
];
const CONCERN_LABEL = { scars: 'Scars + stretch marks', smp: 'Scalp + hairline', brows: 'Brows', unsure: 'Not sure yet' };

function showWelcome() {
  showMap(false); renderStrip(0);
  const el = paint(`
    <div class="rm-welcome">
      <div>
        <p class="rm-kicker">The Art of Healing</p>
        <h1 class="rm-h1">The Restoration<br>Map</h1>
        <p class="rm-sub">Map your starting point for scar revision, camouflage, scalp micropigmentation, or brows, before you ever book.</p>
        <button class="rm-btn rm-btn--olive" id="start">Start My Private Assessment</button>
        <p class="rm-privacy">⬤ Private · about 2 minutes · no pressure to book</p>
      </div>
      <div class="rm-filecard">
        <div class="rm-filecard__top">
          <span class="rm-filecard__tag">Wholesome Empire · Private File</span>
          <span class="rm-filecard__tag">${esc(pathId)}</span>
        </div>
        <div class="rm-filerows">
          <div class="rm-filerow"><span>Patient</span><span>—</span></div>
          <div class="rm-filerow"><span>Concern</span><span>Pending</span></div>
          <div class="rm-filerow"><span>Area</span><span>Pending</span></div>
          <div class="rm-filerow"><span>Readiness</span><span>Pending</span></div>
        </div>
        <div class="rm-filestamp">Awaiting Intake</div>
      </div>
    </div>`, 'rm-welcome-wrap');
  el.querySelector('#start').addEventListener('click', () => { track('started', {}); goto('concern'); });
}

function showConcern() {
  showMap(true); renderStrip(0); updateMap();
  const cards = CONCERN_CARDS.map(c => `
    <button class="rm-pathcard" data-id="${c.id}">
      <span class="rm-stamp">Added to your map</span>
      <span class="rm-pathcard__lines">${contour(170, 170, 85, 85, 6, 18, 16, 'rgba(62,73,56,1)')}</span>
      <span class="rm-pathcard__n">${c.n} /</span>
      <div class="rm-pathcard__t">${esc(c.t)}</div>
      <div class="rm-pathcard__d">${esc(c.d)}</div>
    </button>`).join('');
  const el = paint(`
    <p class="rm-eyebrow">Layer 01 · Concern</p>
    <h2 class="rm-h2">What would you like to map first?</h2>
    <p class="rm-help">Pick the one that feels closest</p>
    <div class="rm-cards rm-cards--grid">${cards}</div>`);
  wireCards(el, 'concern');
}

// ---- generic question (path cards) ----
function showQuestion(screenId) {
  const s = SCREENS[screenId]; if (!s) return;
  showMap(true); renderStrip(stageIndex(screenId)); updateMap();
  if (screenId === 'timeline') return showTimeline();
  if (screenId === 'scar_heal') return showWhenPicker();
  const sel = answers[screenId];
  const cards = s.options.map((o, i) => `
    <button class="rm-pathcard ${sel === o.id ? 'is-selected' : ''}" data-id="${o.id}">
      <span class="rm-stamp">Added to your map</span>
      <span class="rm-pathcard__n">${String(i + 1).padStart(2, '0')} /</span>
      <div class="rm-pathcard__t">${esc(o.label)}</div>
    </button>`).join('');
  const el = paint(`
    <p class="rm-eyebrow">${esc(stageEyebrow(screenId))}</p>
    <h2 class="rm-h2">${esc(s.question)}</h2>
    ${s.help ? `<p class="rm-help">${esc(s.help)}</p>` : ''}
    <div class="rm-cards rm-cards--grid">${cards}</div>`);
  wireCards(el, screenId);
}

function showTimeline() {
  const s = SCREENS.timeline;
  const order = ['researching', 'waiting', 'event', 'ready', 'unsure_ready'];
  const sel = answers.timeline;
  const nodes = order.map(id => {
    const lab = labelOf('timeline', id);
    return `<button class="rm-tl-node ${sel === id ? 'is-selected' : ''}" data-id="${id}"><span class="rm-tl-dot"></span><span class="rm-tl-lab">${esc(lab)}</span></button>`;
  }).join('');
  const el = paint(`
    <p class="rm-eyebrow">Layer 03 · Timeline</p>
    <h2 class="rm-h2">${esc(s.question)}</h2>
    <p class="rm-help">Place yourself on the path</p>
    <div class="rm-timeline"><div class="rm-tl-track"></div><div class="rm-tl-nodes">${nodes}</div></div>`);
  el.querySelectorAll('[data-id]').forEach(n => n.addEventListener('click', () => {
    answers.timeline = n.dataset.id;
    el.querySelectorAll('[data-id]').forEach(x => x.classList.remove('is-selected'));
    n.classList.add('is-selected'); updateMap(); setTimeout(advance, 300);
  }));
}

// "When did it first appear?" — feeds both the readiness bucket and a real
// day count (answers.scar_start) for the "days you've carried this" moment.
const NOW_YEAR = new Date().getFullYear();
function showWhenPicker() {
  let years = '';
  for (let y = NOW_YEAR; y >= NOW_YEAR - 45; y--) years += `<option value="${y}">${y}</option>`;
  years += `<option value="older">Before ${NOW_YEAR - 45}</option>`;
  const el = paint(`
    <p class="rm-eyebrow">Layer 04 · Details</p>
    <h2 class="rm-h2">${esc(SCREENS.scar_heal.question)}</h2>
    <p class="rm-help">${esc(SCREENS.scar_heal.help || '')}</p>
    <div class="rm-when">
      <button class="rm-pathcard" data-heal="lt6"><span class="rm-stamp">Added to your map</span><span class="rm-pathcard__n">01 /</span><div class="rm-pathcard__t">Within the last few months</div></button>
      <div class="rm-when__or"><span>or the year it started</span></div>
      <select class="rm-when__year" id="whenYear" aria-label="Year it started"><option value="">Choose a year…</option>${years}</select>
      <button class="rm-when__unsure" data-heal="unsure">I'm not sure</button>
    </div>`);
  const commit = (heal, year, recent) => { answers.scar_heal = heal; answers.scar_start = year ? { year } : (recent ? { recent: true } : null); updateMap(); setTimeout(advance, 260); };
  el.querySelector('[data-heal="lt6"]').addEventListener('click', e => { e.currentTarget.classList.add('is-selected'); commit('lt6', null, true); });
  el.querySelector('[data-heal="unsure"]').addEventListener('click', () => commit('unsure', null, false));
  el.querySelector('#whenYear').addEventListener('change', ev => {
    const v = ev.target.value; if (!v) return;
    const year = v === 'older' ? NOW_YEAR - 46 : parseInt(v, 10);
    const ya = NOW_YEAR - year;
    commit(ya >= 4 ? 'several' : ya >= 1 ? 'over1' : '6to12', year, false);
  });
}
function carriedDays() {
  const s = answers.scar_start; if (!s) return null;
  if (s.recent) return 90;
  if (!s.year) return null;
  const d = Math.floor((Date.now() - new Date(s.year, 6, 1).getTime()) / 86400000);
  return d > 30 ? d : null;
}
function animateCount(el, target) {
  const fmt = n => n.toLocaleString('en-US');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(target); return; }
  const dur = 1400, t0 = performance.now();
  const tick = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(tick); else el.textContent = fmt(target); };
  requestAnimationFrame(tick);
  setTimeout(() => { el.textContent = fmt(target); }, dur + 150);
}

function stageEyebrow(id) {
  if (/^goal_/.test(id)) return 'Layer 02 · Goal';
  if (id === 'barrier') return 'Layer 04 · One honest question';
  return 'Layer 04 · Details';
}

function wireCards(el, screenId) {
  el.querySelectorAll('.rm-pathcard').forEach(card => card.addEventListener('click', () => {
    answers[screenId] = card.dataset.id;
    if (screenId === 'concern') track('concern_selected', { concern: card.dataset.id });
    el.querySelectorAll('.rm-pathcard').forEach(c => c.classList.remove('is-selected'));
    card.classList.add('is-selected'); updateMap();
    setTimeout(advance, 340); // let the "added to your map" stamp show
  }));
}

// ---- contact ----
function showContact() {
  showMap(true); renderStrip(4); updateMap();
  const el = paint(`
    <p class="rm-eyebrow">Layer 05 · Report</p>
    <h2 class="rm-h2">Your file is ready</h2>
    <p class="rm-sub">Add your details to open your private treatment readiness report and receive a copy by email.</p>
    <div class="rm-field"><label class="rm-label" for="fn">First name</label><input class="rm-input" id="fn" type="text" autocomplete="given-name"></div>
    <div class="rm-field"><label class="rm-label" for="em">Email</label><input class="rm-input" id="em" type="email" inputmode="email" autocomplete="email"></div>
    <div class="rm-field"><label class="rm-label" for="ph">Phone (optional)</label><input class="rm-input" id="ph" type="tel" inputmode="tel" autocomplete="tel"></div>
    <label class="rm-check"><input type="checkbox" id="consent"><span>I understand this is general guidance and agree to be contacted about my inquiry.</span></label>
    <p class="rm-err" id="err"></p>
    <button class="rm-btn rm-btn--olive rm-btn--full" id="open">Build My Treatment Map</button>
    <p class="rm-help" style="margin-top:16px">Your information is only used to follow up · no spam</p>`);
  const $err = el.querySelector('#err');
  el.querySelector('#open').addEventListener('click', async e => {
    const first = el.querySelector('#fn').value.trim();
    const email = el.querySelector('#em').value.trim();
    const phone = el.querySelector('#ph').value.trim();
    if (!first) return ($err.textContent = 'Please enter your first name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return ($err.textContent = 'Please enter a valid email.');
    if (!el.querySelector('#consent').checked) return ($err.textContent = 'Please check the box so we can send your report.');
    e.currentTarget.disabled = true; e.currentTarget.innerHTML = '<span class="rm-spin"></span> Building…';
    const computed = assess(answers, { name: first });
    try { const r = await fetch('/api/wholesome-submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, responses: answers, computed: { ...computed, design: 'restoration_map', path_id: pathId }, referrer, utm_source: utmSource }) }); if (r.ok) { const j = await r.json(); submissionId = j.id; sessionId = j.session_id || sessionId; } } catch (_) {}
    try { await fetch('/api/wholesome-contact', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ submission_id: submissionId, first_name: first, email, phone, opt_in_sms: false }) }); } catch (_) {}
    track('completed', { path: computed.bestFitPath, stage: computed.readinessStage });
    showBuilding(computed, first);
  });
}

// ---- building transition ----
function showBuilding(computed, name) {
  showMap(false); renderStrip(4);
  const steps = ['Checking treatment path', 'Reviewing readiness stage', 'Preparing consult checklist'];
  const el = paint(`
    <div class="rm-building">
      <p class="rm-building__t">Building your treatment map…</p>
      ${steps.map(s => `<p class="rm-building__step"><span class="tick">✓</span>${esc(s)}</p>`).join('')}
    </div>`);
  const nodes = el.querySelectorAll('.rm-building__step');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { showReport(computed, name); return; }
  nodes.forEach((n, i) => setTimeout(() => n.classList.add('is-on'), 350 + i * 560));
  setTimeout(() => showReport(computed, name), 350 + steps.length * 560 + 400);
}

// ---- report (clinic file) ----
function showReport(computed, name) {
  showMap(false); renderStrip(4);
  const fam = computed.pathFamily;
  const logic = REPORT.pathLogic[fam] || REPORT.pathLogic.match;
  const outcome = REPORT.outcomeGuide[fam] || REPORT.outcomeGuide.match;
  const affects = REPORT.whatAffects[fam] || REPORT.whatAffects.match;
  const shot = REPORT.shotList[computed.checklistKey] || REPORT.shotList.unsure;
  const questions = REPORT.consultQuestions[fam] || REPORT.consultQuestions.match;
  const stageMeaning = REPORT.readinessMeaning[computed.readinessStage] || '';
  const step = REPORT.nextStep[computed.nextStepId] || REPORT.nextStep.photo_review;
  const told = personalSummary(answers);
  const fear = computed.barrier ? REPORT.barrierResponse[computed.barrier] : '';
  const days = computed.branch === 'scars' ? carriedDays() : null;
  const primaryHref = ctaHref(computed.nextStepId, fam);
  const secondaryHref = treatmentUrl(fam);
  const secondary = 'Learn more about this treatment';
  const today = new Date().toLocaleDateString('en-CA');

  paint(`
    <div class="rm-report rm-stagger">
      <div class="rm-report__head">
        <p class="rm-report__ey">Wholesome Empire · Private File</p>
        <h1 class="rm-report__ttl">Your Restoration<br>Path Map</h1>
        <p class="rm-report__sub">A private starting point for understanding your options before booking.</p>
        <div class="rm-report__ids">
          <span class="rm-report__id">Prepared for / <b>${esc(name || '—')}</b></span>
          <span class="rm-report__id">Path ID / <b>${esc(pathId)}</b></span>
          <span class="rm-report__id">Date / <b>${esc(today)}</b></span>
        </div>
      </div>
      <div class="rm-report__body">
        <div class="rm-block">
          <p class="rm-mono">Your likely path / <b>Best fit</b></p>
          <p class="rm-path">${esc(computed.bestFitPath)}</p>
        </div>
        <div class="rm-block">
          <p class="rm-mono">Why this path fits</p>
          ${told ? `<p class="rm-body">${esc(told)}</p>` : ''}
          <p class="rm-body" style="margin-top:${told ? '12px' : '0'}">${esc(logic)}</p>
        </div>
        <div class="rm-block">
          <p class="rm-mono">Your readiness stage</p>
          <span class="rm-badge" data-b="${esc(computed.readinessStage)}">${esc(computed.readinessStage)}</span>
          ${stageMeaning ? `<p class="rm-body" style="margin-top:14px">${esc(stageMeaning)}</p>` : ''}
        </div>
        ${fear ? `<div class="rm-block"><div class="rm-fear"><p class="rm-mono">About what's holding you back</p><p>${esc(fear)}</p></div></div>` : ''}
        <div class="rm-block">
          <p class="rm-mono">Realistic outcome guide</p>
          <p class="rm-body"><b>What it may help with:</b> ${esc(outcome.helps)}</p>
          <p class="rm-mono" style="margin:18px 0 8px">What may affect your result</p>
          <ul class="rm-checkgrid">${affects.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
          <p class="rm-body" style="margin-top:16px"><b>What not to expect:</b> ${esc(outcome.notExpect)}</p>
        </div>
        ${days ? `<div class="rm-block rm-days">
          <p class="rm-mono">${esc(DAYS_COPY.label)}</p>
          <p class="rm-days__num" data-count="${days}">${days.toLocaleString('en-US')}</p>
          <p class="rm-days__unit">${esc(DAYS_COPY.unit)}</p>
          <p class="rm-body" style="max-width:46ch">${esc(DAYS_COPY.body)}</p>
        </div>` : ''}
        <div class="rm-block">
          <div class="rm-next">
            <p class="rm-mono">Your next best move / <b>${esc(step.primary)}</b></p>
            <p class="rm-next__h">${esc(step.primary)}</p>
            <p class="rm-next__d">${esc(step.note)}</p>
            <div class="rm-cta-row">
              <a class="rm-btn rm-btn--full" href="${primaryHref}"${extAttr(primaryHref)}>${esc(step.primary)}</a>
              <a class="rm-btn rm-btn--ghostlight rm-btn--full" href="${secondaryHref}"${extAttr(secondaryHref)}>${esc(secondary)}</a>
            </div>
          </div>
        </div>
        <div class="rm-block">
          <p class="rm-mono">Your photo review shot list</p>
          <ul class="rm-prep">${shot.shots.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
          <p class="rm-body" style="margin-top:12px; font-size:14px"><b>Light:</b> ${esc(shot.light)} &nbsp; <b>Avoid:</b> ${esc(shot.avoid)}</p>
        </div>
        <div class="rm-block">
          <p class="rm-mono">Questions worth asking before booking</p>
          <ul class="rm-qs">${questions.map(q => `<li>${esc(q)}</li>`).join('')}</ul>
        </div>
        <p class="rm-disc">${esc(DISCLAIMER)}</p>
      </div>
    </div>`);
  el_stagger();
  const numEl = $stage.querySelector('.rm-days__num');
  if (numEl) {
    const io = new IntersectionObserver((es, o) => { es.forEach(e => { if (e.isIntersecting) { animateCount(numEl, days); o.disconnect(); } }); }, { threshold: 0 });
    io.observe(numEl);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function el_stagger() { $stage.querySelectorAll('.rm-stagger > *').forEach((n, i) => n.style.animationDelay = `${Math.min(i * 70, 500)}ms`); }

// ---- navigation ----
let current = null;
function goto(id) { current = id; if (id === 'concern') showConcern(); else if (id === 'contact') showContact(); else showQuestion(id); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function advance() {
  const flow = flowFor(answers.concern);
  const next = flow[flow.indexOf(current) + 1];
  if (!next || next === 'result') { showContact(); current = 'contact'; return; }
  goto(next);
}

showWelcome();
</script>
</body>
</html>
