<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Art of Healing: Private Treatment Assessment — Wholesome Empire YYC</title>
<meta name="description" content="A private, unhurried assessment that gives you a personalized starting point for scar revision, camouflage, scalp micropigmentation, or brows." />
<meta name="robots" content="index,follow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   WHOLESOME EMPIRE YYC — Private Treatment Path Assessment
   "Studio at dusk" — dim, intimate, restorative. Client brand namespaced
   --we-* so it never shadows the host repo's --gd-* tokens.
   ========================================================================== */
:root {
  /* dusk foundation — warm near-black, cream ink, olive that glows on dark */
  --we-void:#141311; --we-bg:#17161A; --we-surface:#1E1D21; --we-surface-2:#26242A;
  --we-ink:#ECE7DD; --we-ink-2:#C9C3B7; --we-ink-soft:#8F897E;
  --we-rule:rgba(236,231,221,.11); --we-rule-2:rgba(236,231,221,.20);
  --we-olive:#8E9C72; --we-olive-soft:#A6B48A; --we-olive-deep:#3F4A3C;
  --we-olive-tint:rgba(142,156,114,.13);
  --we-cream:#EFEAE0;

  --we-font-display:"Oswald","Helvetica Neue",Arial,sans-serif;
  --we-font-body:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --we-radius:16px; --we-radius-sm:11px; --we-radius-pill:999px;
  --we-ease:cubic-bezier(.19,.68,.24,1);
  --we-maxw:640px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--we-bg); color:var(--we-ink);
  font-family:var(--we-font-body); font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  position:relative; min-height:100vh;
}
/* film grain — the "studio" texture, sits over everything, ignores pointer */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
  background-image:url("/assets/grain.svg"); background-size:260px; opacity:.05; mix-blend-mode:overlay;
}
img{max-width:100%;display:block}
button{font-family:inherit}

/* --- masthead ------------------------------------------------------------ */
.we-nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 26px; border-bottom:1px solid var(--we-rule); position:relative; z-index:5;
}
.we-nav__brand{
  font-family:var(--we-font-display); font-weight:500; font-size:17px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--we-ink);
  text-decoration:none; display:flex; align-items:center; gap:11px;
}
.we-nav__brand .mark{
  width:9px;height:9px;border-radius:50%;background:var(--we-olive);
  box-shadow:0 0 12px 1px rgba(142,156,114,.6); display:inline-block;flex:none;
}
.we-nav__tag{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--we-ink-soft); font-weight:500; }
@media(max-width:520px){ .we-nav__tag{display:none} }

/* --- shell / dusk light -------------------------------------------------- */
.we-main{ min-height:calc(100vh - 62px); display:flex; flex-direction:column; position:relative; z-index:2; }
/* warm light through a window, upper-left, fading into the dark */
.we-main::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(120% 80% at 18% 0%, rgba(150,140,96,.16) 0%, rgba(150,140,96,.05) 30%, transparent 62%),
    radial-gradient(90% 70% at 92% 100%, rgba(63,74,60,.20) 0%, transparent 60%),
    linear-gradient(180deg, var(--we-bg) 0%, var(--we-void) 100%);
}
.we-shell{ max-width:var(--we-maxw); margin:0 auto; padding:0 26px; width:100%; }

/* --- progress ------------------------------------------------------------ */
.we-progress{ padding:30px 0 4px; }
.we-progress__row{
  display:flex; align-items:center; justify-content:space-between;
  font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--we-ink-soft); font-weight:500; margin-bottom:11px;
}
.we-progress__back{
  background:none; border:none; cursor:pointer; padding:4px 0;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--we-ink-soft); font-weight:500; display:inline-flex; align-items:center; gap:6px;
  transition:color 200ms var(--we-ease);
}
.we-progress__back:hover{ color:var(--we-olive-soft) }
.we-progress__back[hidden]{ display:none }
.we-track{ height:3px; background:rgba(236,231,221,.09); border-radius:var(--we-radius-pill); overflow:hidden; }
.we-track__fill{
  height:100%; background:linear-gradient(90deg,var(--we-olive-deep),var(--we-olive));
  box-shadow:0 0 10px rgba(142,156,114,.5);
  border-radius:var(--we-radius-pill); width:0%; transition:width 620ms var(--we-ease);
}

/* --- screen container + motion ------------------------------------------- */
.we-screen{ flex:1; padding:40px 0 48px; animation:we-enter 620ms var(--we-ease) both; }
@keyframes we-enter{ from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }
@keyframes we-rise{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
@keyframes we-reveal{ 0%{opacity:0; transform:translateY(24px) scale(.985); filter:blur(3px)} 100%{opacity:1; transform:none; filter:none} }
@keyframes we-draw{ from{transform:scaleX(0)} to{transform:scaleX(1)} }
@media(prefers-reduced-motion:reduce){
  .we-screen,.we-reveal,.we-stagger>*{animation:none!important}
  .we-track__fill{transition:none}
}

.we-eyebrow{
  font-family:var(--we-font-display); font-weight:400; font-size:12px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--we-olive-soft); margin:0 0 16px;
}
.we-h1{
  font-family:var(--we-font-display); font-weight:500; text-transform:uppercase;
  font-size:clamp(34px,8.5vw,54px); line-height:1.0; letter-spacing:.01em;
  color:var(--we-cream); margin:0 0 20px;
}
.we-q{
  font-family:var(--we-font-display); font-weight:400; text-transform:uppercase;
  font-size:clamp(24px,5.4vw,34px); line-height:1.08; letter-spacing:.012em;
  color:var(--we-cream); margin:0 0 10px;
}
.we-hero-sub{
  font-family:var(--we-font-display); font-weight:400; text-transform:uppercase;
  font-size:clamp(13px,2.6vw,16px); letter-spacing:.28em; color:var(--we-olive-soft);
  margin:-8px 0 22px; padding:0 0 0 2px;
}
.we-help{ color:var(--we-ink-soft); font-size:15px; margin:0 0 26px; }
.we-lede{ color:var(--we-ink-2); font-size:17.5px; line-height:1.62; margin:0 0 30px; max-width:34em; }

/* --- option cards -------------------------------------------------------- */
.we-options{ display:flex; flex-direction:column; gap:11px; }
.we-option{
  text-align:left; width:100%; cursor:pointer;
  background:var(--we-surface); border:1px solid var(--we-rule);
  border-radius:var(--we-radius); padding:18px 20px;
  font-size:16px; font-weight:450; color:var(--we-ink);
  display:flex; align-items:center; gap:15px;
  transition:border-color 220ms var(--we-ease), background 220ms var(--we-ease), transform 160ms var(--we-ease), box-shadow 220ms var(--we-ease);
}
.we-option:hover{ border-color:var(--we-rule-2); background:var(--we-surface-2); box-shadow:0 0 0 1px var(--we-olive-tint), 0 14px 40px -28px rgba(0,0,0,.9); }
.we-option:active{ transform:scale(.993) }
.we-option:focus-visible{ outline:2px solid var(--we-olive); outline-offset:2px }
.we-option.is-selected{ border-color:var(--we-olive); background:var(--we-olive-tint); }
.we-option__tick{
  flex:none; width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--we-ink-soft); position:relative; transition:all 220ms var(--we-ease);
}
.we-option.is-selected .we-option__tick{ border-color:var(--we-olive); background:var(--we-olive); box-shadow:0 0 12px rgba(142,156,114,.6); }
.we-option.is-selected .we-option__tick::after{
  content:""; position:absolute; left:6px; top:3px; width:5px; height:9px;
  border:solid var(--we-void); border-width:0 2px 2px 0; transform:rotate(45deg);
}

/* --- buttons ------------------------------------------------------------- */
.we-btn{
  font-family:var(--we-font-display); font-weight:500; text-transform:uppercase;
  letter-spacing:.11em; font-size:15px; cursor:pointer;
  border:none; border-radius:var(--we-radius-pill); padding:17px 32px;
  background:var(--we-cream); color:var(--we-void);
  transition:background 240ms var(--we-ease), transform 160ms var(--we-ease), box-shadow 240ms var(--we-ease);
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.we-btn:hover{ background:var(--we-olive-soft); box-shadow:0 0 30px -6px rgba(142,156,114,.55); }
.we-btn:active{ transform:translateY(1px) }
.we-btn:disabled{ opacity:.55; cursor:not-allowed }
.we-btn--full{ width:100% }
.we-btn--ghost{ background:transparent; color:var(--we-ink); border:1px solid var(--we-rule-2); }
.we-btn--ghost:hover{ background:transparent; border-color:var(--we-olive); color:var(--we-olive-soft); box-shadow:none; }
.we-microcopy{ font-size:13px; color:var(--we-ink-soft); margin:18px 0 0; }

/* --- concierge chat (POC, ?mode=chat) ------------------------------------ */
.we-chat{ display:flex; flex-direction:column; min-height:calc(100vh - 62px); }
.we-chat__log{ flex:1; display:flex; flex-direction:column; gap:14px; padding:34px 0 20px; }
.we-msg{ max-width:82%; font-size:15.5px; line-height:1.55; padding:14px 17px; border-radius:18px; animation:we-rise 380ms var(--we-ease) both; }
.we-msg--bot{ align-self:flex-start; background:var(--we-surface); border:1px solid var(--we-rule); border-bottom-left-radius:5px; color:var(--we-ink); }
.we-msg--user{ align-self:flex-end; background:var(--we-olive-tint); border:1px solid rgba(142,156,114,.32); border-bottom-right-radius:5px; color:var(--we-cream); }
.we-typing{ align-self:flex-start; display:flex; gap:5px; padding:16px 18px; background:var(--we-surface); border:1px solid var(--we-rule); border-radius:18px; border-bottom-left-radius:5px; }
.we-typing span{ width:7px; height:7px; border-radius:50%; background:var(--we-ink-soft); animation:we-blink 1.2s infinite both; }
.we-typing span:nth-child(2){ animation-delay:.2s } .we-typing span:nth-child(3){ animation-delay:.4s }
@keyframes we-blink{ 0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
.we-suggest{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 8px; }
.we-suggest button{ cursor:pointer; font-family:var(--we-font-body); font-size:13.5px; color:var(--we-ink-2); background:transparent; border:1px solid var(--we-rule-2); border-radius:var(--we-radius-pill); padding:9px 15px; transition:all 160ms var(--we-ease); }
.we-suggest button:hover{ border-color:var(--we-olive); color:var(--we-ink); background:var(--we-olive-tint); }
.we-chat__bar{ position:sticky; bottom:0; display:flex; gap:10px; align-items:flex-end; padding:14px 0 20px; background:linear-gradient(180deg, transparent, var(--we-void) 26%); }
.we-chat__input{ flex:1; resize:none; font-family:inherit; font-size:15.5px; line-height:1.4; color:var(--we-ink); background:rgba(0,0,0,.28); border:1px solid var(--we-rule-2); border-radius:20px; padding:13px 17px; max-height:120px; }
.we-chat__input:focus{ outline:none; border-color:var(--we-olive); }
.we-chat__input::placeholder{ color:var(--we-ink-soft); }
.we-chat__send{ flex:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; background:var(--we-cream); color:var(--we-void); font-size:18px; display:flex; align-items:center; justify-content:center; transition:background 180ms var(--we-ease); }
.we-chat__send:hover{ background:var(--we-olive-soft); }
.we-chat__note{ text-align:center; font-size:11.5px; color:var(--we-ink-soft); padding:0 0 10px; letter-spacing:.02em; }

/* --- result: plan summary strip ------------------------------------------ */
.we-plan{
  background:linear-gradient(180deg, rgba(142,156,114,.12), rgba(142,156,114,.03));
  border:1px solid rgba(142,156,114,.30); border-radius:var(--we-radius);
  padding:22px 24px 24px; margin:0 0 30px;
}
.we-plan__row{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:0 0 14px; }
.we-plan__path{ font-family:var(--we-font-display); font-weight:500; text-transform:uppercase; font-size:clamp(21px,4.4vw,27px); line-height:1.06; color:var(--we-cream); margin:0; flex:1 1 auto; }
.we-plan__peek{ font-size:13px; color:var(--we-ink-soft); margin:16px 0 0; padding:14px 0 0; border-top:1px solid var(--we-rule); }
.we-plan__peek b{ color:var(--we-ink-2); font-weight:600; }

/* --- result: sticky next-step bar ---------------------------------------- */
.we-sticky{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(20,19,17,.86); backdrop-filter:blur(12px) saturate(1.1); -webkit-backdrop-filter:blur(12px) saturate(1.1);
  border-top:1px solid var(--we-rule-2); padding:12px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  transform:translateY(120%); transition:transform 420ms var(--we-ease);
}
.we-sticky.is-shown{ transform:none; }
.we-sticky__label{ font-family:var(--we-font-display); text-transform:uppercase; letter-spacing:.08em; font-size:12px; color:var(--we-ink-soft); display:flex; flex-direction:column; gap:2px; }
.we-sticky__label b{ color:var(--we-cream); font-weight:500; font-size:14px; letter-spacing:.04em; }
.we-sticky .we-btn{ padding:13px 24px; font-size:14px; white-space:nowrap; }
@media(max-width:520px){ .we-sticky__label{ display:none } .we-sticky{ justify-content:center } .we-sticky .we-btn{ width:100% } }

/* --- disclaimer ---------------------------------------------------------- */
.we-disclaimer{
  font-size:12.5px; line-height:1.6; color:var(--we-ink-soft);
  border-left:1px solid var(--we-rule-2); padding:2px 0 2px 15px; margin:26px 0 0;
}

/* --- form ---------------------------------------------------------------- */
.we-field{ margin:0 0 17px }
.we-label{ display:block; font-size:12.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--we-ink-2); margin:0 0 8px; }
.we-label .opt{ color:var(--we-ink-soft); font-weight:400; text-transform:none; letter-spacing:0 }
.we-input{
  width:100%; padding:15px 16px; font-size:16px; font-family:inherit;
  border:1px solid var(--we-rule-2); border-radius:var(--we-radius-sm);
  background:rgba(0,0,0,.22); color:var(--we-ink);
}
.we-input::placeholder{ color:var(--we-ink-soft) }
.we-input:focus{ outline:none; border-color:var(--we-olive); box-shadow:0 0 0 3px var(--we-olive-tint) }
.we-check{ display:flex; align-items:flex-start; gap:12px; margin:8px 0 4px; cursor:pointer; }
.we-check input{ margin-top:3px; width:17px; height:17px; accent-color:var(--we-olive); flex:none }
.we-check span{ font-size:13.5px; color:var(--we-ink-2); line-height:1.5 }
.we-err{ color:#E0987F; font-size:13px; margin:8px 0 0; min-height:1px }

/* --- result: the letter -------------------------------------------------- */
.we-letter__eyebrow{
  font-family:var(--we-font-display); font-weight:400; font-size:11.5px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--we-olive-soft); margin:0 0 18px;
}
.we-letter__salutation{
  font-family:var(--we-font-display); font-weight:500; text-transform:uppercase;
  font-size:clamp(30px,7vw,46px); line-height:1.0; letter-spacing:.01em;
  color:var(--we-cream); margin:0 0 18px;
}
.we-letter__lede{ color:var(--we-ink-2); font-size:16.5px; line-height:1.64; margin:0 0 26px; }
.we-ack{
  font-family:var(--we-font-display); font-weight:300; text-transform:none;
  font-size:clamp(19px,3.6vw,23px); line-height:1.34; letter-spacing:.005em;
  color:var(--we-olive-soft); border-left:2px solid var(--we-olive);
  padding:4px 0 4px 18px; margin:0 0 34px;
}

.we-block{ margin:0 0 30px; }
.we-block__label{
  font-family:var(--we-font-display); font-weight:400; font-size:11.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--we-ink-soft); margin:0 0 12px;
}
.we-path{
  font-family:var(--we-font-display); font-weight:500; text-transform:uppercase;
  font-size:clamp(27px,6vw,40px); line-height:1.04; letter-spacing:.01em;
  color:var(--we-cream); margin:0; padding:0 0 16px; position:relative;
}
.we-path::after{
  content:""; display:block; height:1px; margin-top:16px; width:100%;
  background:linear-gradient(90deg,var(--we-olive),transparent);
  transform-origin:left; animation:we-draw 900ms var(--we-ease) 500ms both;
}
.we-badge{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--we-olive-tint); color:var(--we-olive-soft);
  border:1px solid rgba(142,156,114,.35); border-radius:var(--we-radius-pill);
  padding:9px 18px; font-family:var(--we-font-display); font-weight:500;
  text-transform:uppercase; letter-spacing:.07em; font-size:14px;
}
.we-body{ color:var(--we-ink-2); font-size:15.5px; line-height:1.66; margin:14px 0 0 }
.we-list{ list-style:none; margin:4px 0 0; padding:0; display:grid; gap:10px; }
.we-list li{ display:flex; align-items:flex-start; gap:12px; font-size:15px; color:var(--we-ink); }
.we-list li::before{
  content:""; flex:none; width:6px; height:6px; margin-top:8px; border-radius:1px;
  background:var(--we-olive); transform:rotate(45deg); box-shadow:0 0 8px rgba(142,156,114,.5);
}
.we-check-list li::before{
  content:""; width:14px; height:14px; margin-top:2px; border-radius:4px; background:transparent;
  border:1.5px solid var(--we-olive); transform:none; box-shadow:none;
}
/* the fear answered — the emotional centerpiece */
.we-fear{
  background:linear-gradient(180deg, rgba(142,156,114,.10), rgba(142,156,114,.04));
  border:1px solid rgba(142,156,114,.28); border-radius:var(--we-radius);
  padding:24px 24px; margin:0 0 30px;
}
.we-fear .we-block__label{ color:var(--we-olive-soft) }
.we-fear p{ color:var(--we-ink); font-size:16px; line-height:1.66; margin:12px 0 0 }

/* next step — the one bright, warm card (the action) */
.we-next{
  background:var(--we-cream); color:var(--we-void); border-radius:var(--we-radius);
  padding:28px 26px; margin:0 0 30px; box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
}
.we-next__label{ font-family:var(--we-font-display); font-weight:400; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(20,19,17,.5); margin:0 0 10px; }
.we-next__head{ font-family:var(--we-font-display); font-weight:600; text-transform:uppercase; font-size:24px; line-height:1.08; margin:0 0 7px; color:var(--we-void); }
.we-next__note{ color:rgba(20,19,17,.66); font-size:14.5px; margin:0 0 20px }
.we-next .we-btn{ background:var(--we-void); color:var(--we-cream); }
.we-next .we-btn:hover{ background:var(--we-olive-deep); color:var(--we-cream) }
.we-next .we-btn--ghost{ background:transparent; color:var(--we-void); border-color:rgba(20,19,17,.28); }
.we-next .we-btn--ghost:hover{ border-color:var(--we-void); color:var(--we-void); }
.we-cta-row{ display:flex; flex-direction:column; gap:11px; }

.we-caution{
  background:rgba(0,0,0,.22); border:1px solid var(--we-rule-2); border-radius:var(--we-radius-sm);
  padding:15px 17px; margin:0 0 30px;
}
.we-caution ul{ margin:8px 0 0; padding-left:18px; font-size:14px; color:var(--we-ink-soft) }

/* closing — the restorative reframe, held */
.we-closing{
  border-top:1px solid var(--we-rule); padding:32px 0 0; margin:8px 0 0;
}
.we-closing p{
  font-family:var(--we-font-display); font-weight:300; font-size:clamp(19px,3.8vw,24px);
  line-height:1.42; color:var(--we-ink); margin:0 0 22px; letter-spacing:.006em;
}
.we-signoff{ font-family:var(--we-font-display); font-weight:400; text-transform:uppercase; letter-spacing:.12em; font-size:13.5px; color:var(--we-olive-soft); white-space:pre-line; line-height:1.7; }

/* the "days you've carried this" moment — the emotional crescendo */
.we-days{ text-align:center; padding:40px 8px 4px; margin:14px 0 8px; border-top:1px solid var(--we-rule); }
.we-days__label{ font-family:var(--we-font-display); font-weight:400; font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--we-olive-soft); margin:0 0 18px; }
.we-days__num{ font-family:var(--we-font-display); font-weight:600; font-size:clamp(64px,17vw,124px); line-height:.92; letter-spacing:-.01em; color:var(--we-cream); margin:0; font-variant-numeric:tabular-nums; text-shadow:0 0 42px rgba(142,156,114,.28); }
.we-days__unit{ font-family:var(--we-font-display); font-weight:500; text-transform:uppercase; letter-spacing:.32em; font-size:14px; color:var(--we-olive-soft); margin:8px 0 0; }

.we-when__unsure:hover{ color:var(--we-olive-soft); }

/* stagger children of the report for a soft cascade */
.we-stagger>*{ animation:we-rise 640ms var(--we-ease) both; }

/* --- footer -------------------------------------------------------------- */
.we-footer{
  border-top:1px solid var(--we-rule); background:var(--we-void); color:var(--we-ink-soft);
  padding:30px 26px; text-align:center; font-size:12.5px; line-height:1.65; position:relative; z-index:2;
}
.we-footer strong{ color:var(--we-ink); font-family:var(--we-font-display); letter-spacing:.16em; text-transform:uppercase; font-weight:500; }
.we-hidden{ display:none !important }
.we-spinner{ display:inline-block; width:15px; height:15px; border:2px solid rgba(20,19,17,.3); border-top-color:var(--we-void); border-radius:50%; animation:we-spin .7s linear infinite; }
@keyframes we-spin{ to{transform:rotate(360deg)} }
</style>
</head>
<body>
<nav class="we-nav">
  <a class="we-nav__brand" href="/"><span class="mark"></span>Wholesome Empire</a>
  <span class="we-nav__tag">Paramedical Clinic · Calgary</span>
</nav>

<main class="we-main">
  <div class="we-shell">
    <div class="we-progress we-hidden" id="progress">
      <div class="we-progress__row">
        <button class="we-progress__back" id="back" hidden>← Back</button>
        <span id="stepLabel"></span>
      </div>
      <div class="we-track"><div class="we-track__fill" id="fill"></div></div>
    </div>
    <div id="screen" class="we-screen"></div>
  </div>
</main>

<div class="we-sticky" id="sticky" aria-hidden="true">
  <span class="we-sticky__label">Your next step<b id="stickyLabel"></b></span>
  <a class="we-btn" id="stickyBtn" href="#">Continue</a>
</div>

<footer class="we-footer">
  <strong>Wholesome Empire YYC</strong><br />
  Where mastery meets compassion.<br />
  This assessment is for general guidance only and does not replace a consultation or medical advice.
</footer>

<script type="module">
import { assess } from '/tools/wholesome/assessment.js';
import { SCREENS, flowFor, REPORT, FLAG_LABELS, DISCLAIMER, LETTER, DAYS_COPY, personalSummary } from '/tools/wholesome/content.js';

// --- session + telemetry ---------------------------------------------------
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

let sessionId = sessionStorage.getItem('we_sid');
if (!sessionId) { sessionId = uuid(); sessionStorage.setItem('we_sid', sessionId); }

const utmSource = new URLSearchParams(location.search).get('utm_source');
const referrer = document.referrer || null;

function track(event_type, metadata) {
  try {
    navigator.sendBeacon?.('/api/wholesome-event',
      new Blob([JSON.stringify({ session_id: sessionId, event_type, metadata })], { type: 'application/json' }))
      || fetch('/api/wholesome-event', { method: 'POST', headers: { 'content-type': 'application/json' },
           body: JSON.stringify({ session_id: sessionId, event_type, metadata }), keepalive: true });
  } catch (_) {}
}

// --- state -----------------------------------------------------------------
const answers = {};
let stack = [];
let submissionId = null;

let $screen = document.getElementById('screen');
const $progress = document.getElementById('progress');
const $fill = document.getElementById('fill');
const $stepLabel = document.getElementById('stepLabel');
const $back = document.getElementById('back');
const $sticky = document.getElementById('sticky');

// ---- Clinic config — swap these for the clinic's real details before launch.
const CONFIG = {
  clinicEmail: 'hello@wholesomeempire.ca',   // [TODO: confirm with clinic]
  bookingUrl: '',                            // [TODO: clinic's real booking link (Calendly/Acuity/site). Empty = fall back to email.]
};
const MAIL = CONFIG.clinicEmail;
function hideSticky() { $sticky.classList.remove('is-shown'); $sticky.setAttribute('aria-hidden', 'true'); }

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function paint(html, cls) {
  const fresh = $screen.cloneNode(false);
  if (cls) fresh.className = 'we-screen ' + cls;
  fresh.innerHTML = html;
  $screen.parentElement.replaceChild(fresh, $screen);
  $screen = fresh;
  return fresh;
}

// --- flow helpers ----------------------------------------------------------
function stepScreens() {
  return flowFor(answers.concern).filter(id => id !== 'result');
}
function updateProgress(currentId) {
  const steps = stepScreens();
  const idx = steps.indexOf(currentId);
  if (idx < 0) { $progress.classList.add('we-hidden'); return; }
  $progress.classList.remove('we-hidden');
  $stepLabel.textContent = `Step ${idx + 1} of ${steps.length}`;
  $fill.style.width = `${((idx + 1) / steps.length) * 100}%`;
  $back.hidden = stack.length === 0;
}

// --- screens ---------------------------------------------------------------
function showWelcome() {
  $progress.classList.add('we-hidden');
  const el = paint(`
    <p class="we-eyebrow">Not sure where to start?</p>
    <h1 class="we-h1">The Art<br>of Healing</h1>
    <p class="we-hero-sub">Private Treatment Assessment</p>
    <p class="we-lede">Take a few quiet minutes and answer honestly. You'll leave with a personalized
      starting point for scar revision, camouflage, scalp micropigmentation, or brows, and a
      clearer sense of what's possible for you.</p>
    <button class="we-btn we-btn--full" id="start">Find My Treatment Path</button>
    <p class="we-microcopy">About 2 minutes. Private. No photos required, and no pressure to book.</p>
    <p class="we-disclaimer">This assessment is for general guidance only. A specialist will confirm whether treatment is right for you.</p>
  `);
  el.querySelector('#start').addEventListener('click', () => {
    track('started', { utm_source: utmSource });
    goto('concern');
  });
}

function showQuestion(screenId) {
  const s = SCREENS[screenId];
  if (!s) return;
  updateProgress(screenId);
  const selected = answers[screenId];

  const inputHtml = screenId === 'scar_heal'
    ? renderWhenPicker(selected)
    : `<div class="we-options">${s.options.map(o => `
      <button class="we-option ${selected === o.id ? 'is-selected' : ''}" data-id="${esc(o.id)}">
        <span class="we-option__tick"></span><span>${esc(o.label)}</span>
      </button>`).join('')}</div>`;

  const el = paint(`
    <p class="we-eyebrow">${esc(s.eyebrow || '')}</p>
    <h2 class="we-q">${esc(s.question)}</h2>
    ${s.help ? `<p class="we-help">${esc(s.help)}</p>` : ''}
    ${inputHtml}
  `);

  if (screenId === 'scar_heal') { wireWhenPicker(el); return; }

  // One unified select handler for every input type — anything carrying a
  // data-id selects and advances.
  el.querySelectorAll('[data-id]').forEach(node => {
    node.addEventListener('click', () => {
      answers[screenId] = node.dataset.id;
      if (screenId === 'concern') track('concern_selected', { concern: node.dataset.id });
      el.querySelectorAll('[data-id]').forEach(n => n.classList.remove('is-selected'));
      node.classList.add('is-selected');
      setTimeout(advance, 260);
    });
  });
}

// "When did it first appear?" — recent chip + a year select + not-sure. Feeds
// BOTH the readiness bucket (answers.scar_heal) and the real day count
// (answers.scar_start), which powers the "days you've carried this" moment.
const NOW_YEAR = new Date().getFullYear();
function renderWhenPicker(selected) {
  let years = '';
  for (let y = NOW_YEAR; y >= NOW_YEAR - 45; y--) years += `<option value="${y}">${y}</option>`;
  years += `<option value="older">Before ${NOW_YEAR - 45}</option>`;
  return `
    <div class="we-when">
      <button class="we-option" data-heal="lt6"><span class="we-option__tick"></span><span>Within the last few months</span></button>
      <div class="we-when__or"><span>or the year it started</span></div>
      <select class="we-when__year" id="whenYear" aria-label="Year it started">
        <option value="">Choose a year…</option>
        ${years}
      </select>
      <button class="we-when__unsure" data-heal="unsure">I'm not sure</button>
    </div>`;
}
function wireWhenPicker(el) {
  const commit = (heal, startYear, recent) => {
    answers.scar_heal = heal;
    answers.scar_start = startYear ? { year: startYear } : (recent ? { recent: true } : null);
    setTimeout(advance, 220);
  };
  el.querySelector('[data-heal="lt6"]').addEventListener('click', e => {
    e.currentTarget.classList.add('is-selected'); commit('lt6', null, true);
  });
  el.querySelector('[data-heal="unsure"]').addEventListener('click', e => {
    e.currentTarget.classList.add('is-selected'); commit('unsure', null, false);
  });
  el.querySelector('#whenYear').addEventListener('change', ev => {
    const v = ev.target.value;
    if (!v) return;
    const year = v === 'older' ? NOW_YEAR - 46 : parseInt(v, 10);
    const yearsAgo = NOW_YEAR - year;
    const heal = yearsAgo >= 4 ? 'several' : yearsAgo >= 1 ? 'over1' : '6to12';
    commit(heal, year, false);
  });
}

// Real days carried, from the start the visitor gave us. null if unknown.
function carriedDays() {
  const s = answers.scar_start;
  if (!s) return null;
  if (s.recent) return 90;
  if (!s.year) return null;
  const days = Math.floor((Date.now() - new Date(s.year, 6, 1).getTime()) / 86400000);
  return days > 30 ? days : null;
}

// Count up to the number when it scrolls into view. Honors reduced-motion.
function animateCount(el, target) {
  const fmt = n => n.toLocaleString('en-US');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(target); return; }
  const dur = 1400, t0 = performance.now();
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(tick); else el.textContent = fmt(target);
  };
  requestAnimationFrame(tick);
  // Guarantee the final value even if rAF is throttled (backgrounded tab).
  setTimeout(() => { el.textContent = fmt(target); }, dur + 150);
}


function showContact() {
  updateProgress('contact');
  const el = paint(`
    <p class="we-eyebrow">Almost there</p>
    <h2 class="we-q">Your report is ready</h2>
    <p class="we-help">Enter your details to read your private treatment readiness report and receive a copy by email. This stays between you and the clinic.</p>
    <div class="we-field">
      <label class="we-label" for="fn">First name</label>
      <input class="we-input" id="fn" type="text" autocomplete="given-name" />
    </div>
    <div class="we-field">
      <label class="we-label" for="em">Email</label>
      <input class="we-input" id="em" type="email" autocomplete="email" inputmode="email" />
    </div>
    <div class="we-field">
      <label class="we-label" for="ph">Phone <span class="opt">(optional)</span></label>
      <input class="we-input" id="ph" type="tel" autocomplete="tel" inputmode="tel" />
    </div>
    <label class="we-check">
      <input type="checkbox" id="consent" />
      <span>I understand this is general guidance and agree to be contacted about my inquiry.</span>
    </label>
    <label class="we-check">
      <input type="checkbox" id="sms" />
      <span>You can also text me (optional).</span>
    </label>
    <p class="we-err" id="err"></p>
    <button class="we-btn we-btn--full" id="view">View My Report</button>
    <p class="we-microcopy">Your information is only used to follow up about your inquiry. No spam, ever.</p>
  `);
  track('reached_contact');
  const $err = el.querySelector('#err');
  el.querySelector('#view').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const first = el.querySelector('#fn').value.trim();
    const email = el.querySelector('#em').value.trim();
    const phone = el.querySelector('#ph').value.trim();
    const consent = el.querySelector('#consent').checked;
    const sms = el.querySelector('#sms').checked;
    $err.textContent = '';
    if (!first) return ($err.textContent = 'Please enter your first name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return ($err.textContent = 'Please enter a valid email.');
    if (!consent) return ($err.textContent = 'Please check the box so we can send your report.');

    btn.disabled = true;
    btn.innerHTML = '<span class="we-spinner"></span> Preparing your report…';

    const computed = assess(answers, { name: first });
    try {
      const r = await fetch('/api/wholesome-submit', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, responses: answers, computed, referrer, utm_source: utmSource }),
      });
      if (r.ok) { const j = await r.json(); submissionId = j.id; sessionId = j.session_id || sessionId; }
    } catch (_) {}
    try {
      await fetch('/api/wholesome-contact', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ submission_id: submissionId, first_name: first, email, phone, opt_in_sms: sms }),
      });
    } catch (_) {}
    track('contact_submitted', { path: computed.bestFitPath, stage: computed.readinessStage });
    track('completed', { path: computed.bestFitPath, stage: computed.readinessStage });
    showResult(computed, first);
  });
}

function showResult(computed, firstName) {
  $progress.classList.add('we-hidden');
  stack = [];
  const fam = computed.pathFamily;
  const means = REPORT.whatThisMeans[fam] || REPORT.whatThisMeans.match;
  const affects = REPORT.whatAffects[fam] || REPORT.whatAffects.match;
  const checklist = REPORT.checklist[computed.checklistKey] || REPORT.checklist.unsure;
  const stageMeaning = REPORT.readinessMeaning[computed.readinessStage] || '';
  const step = REPORT.nextStep[computed.nextStepId] || REPORT.nextStep.photo_review;
  const ack = REPORT.acknowledgment[computed.branch] || '';
  const fearReply = computed.barrier ? REPORT.barrierResponse[computed.barrier] : '';
  const told = personalSummary(answers); // the answer-referencing paragraph
  const days = computed.branch === 'scars' ? carriedDays() : null;

  const primaryHref = CONFIG.bookingUrl || `mailto:${MAIL}?subject=${encodeURIComponent(step.primary + ': ' + computed.bestFitPath)}`;

  const cautions = (computed.cautionFlags || [])
    .filter(f => f !== 'wait_prepare')
    .map(f => FLAG_LABELS[f]).filter(Boolean);

  const affectsHtml = affects.map(a => `<li>${esc(a)}</li>`).join('');
  const checkHtml = checklist.map(c => `<li>${esc(c)}</li>`).join('');
  const cautionHtml = cautions.length ? `
    <div class="we-caution">
      <p class="we-block__label">Worth mentioning to your specialist</p>
      <ul>${cautions.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>` : '';
  const fearHtml = fearReply ? `
    <div class="we-fear">
      <p class="we-block__label">About what's holding you back</p>
      <p>${esc(fearReply)}</p>
    </div>` : '';

  const secondary = computed.nextStepId === 'consult_phone' || computed.nextStepId === 'consult_brow'
    ? 'Email Me My Report' : 'Learn More About This Treatment';

  const el = paint(`
    <div class="we-stagger">
      <p class="we-letter__eyebrow">Your Treatment Readiness Report</p>
      <h1 class="we-letter__salutation we-reveal" style="animation:we-reveal 900ms var(--we-ease) both">${esc(LETTER.open(firstName))}</h1>
      <p class="we-letter__lede">${esc(LETTER.lede)}</p>
      ${ack ? `<p class="we-ack">${esc(ack)}</p>` : ''}

      <div class="we-plan">
        <div class="we-plan__row">
          <p class="we-plan__path">${esc(computed.bestFitPath)}</p>
          <span class="we-badge">${esc(computed.readinessStage)}</span>
        </div>
        <a class="we-btn we-btn--full" href="${primaryHref}">${esc(step.primary)}</a>
        <p class="we-plan__peek">Below: <b>what you told us</b>, what may shape your result, and your <b>consult prep checklist</b>.</p>
      </div>

      ${told ? `<div class="we-block">
        <p class="we-block__label">What you told us</p>
        <p class="we-body" style="margin-top:0">${esc(told)}</p>
      </div>` : ''}

      <div class="we-block">
        <p class="we-block__label">Why this is where we'd start</p>
        <p class="we-body" style="margin-top:0">${esc(means)}</p>
        ${stageMeaning ? `<p class="we-body">${esc(stageMeaning)}</p>` : ''}
      </div>

      ${fearHtml}

      <div class="we-block">
        <p class="we-block__label">What may shape your result</p>
        <ul class="we-list">${affectsHtml}</ul>
      </div>

      ${cautionHtml}

      <div class="we-block">
        <p class="we-block__label">Your consult prep checklist</p>
        <ul class="we-list we-check-list">${checkHtml}</ul>
      </div>

      <div class="we-next">
        <p class="we-next__label">Your next best step</p>
        <p class="we-next__head">${esc(step.primary)}</p>
        <p class="we-next__note">${esc(step.note)}</p>
        <div class="we-cta-row">
          <a class="we-btn we-btn--full" href="${primaryHref}">${esc(step.primary)}</a>
          <button class="we-btn we-btn--ghost we-btn--full" id="secondary">${esc(secondary)}</button>
        </div>
      </div>

      ${days ? `<div class="we-days">
        <p class="we-days__label">${esc(DAYS_COPY.label)}</p>
        <p class="we-days__num" data-count="${days}">0</p>
        <p class="we-days__unit">${esc(DAYS_COPY.unit)}</p>
        <p class="we-days__copy">${esc(DAYS_COPY.body)}</p>
      </div>` : ''}

      <div class="we-closing">
        <p>${esc(LETTER.closing)}</p>
        <p class="we-signoff">${esc(LETTER.signoff)}</p>
      </div>

      <p class="we-disclaimer">${esc(DISCLAIMER)}</p>
    </div>
  `);

  // soft cascade on the report blocks
  el.querySelectorAll('.we-stagger > *').forEach((node, i) => {
    node.style.animationDelay = `${Math.min(i * 80, 640)}ms`;
  });

  // Count the "days carried" up as it scrolls into view.
  const numEl = el.querySelector('.we-days__num');
  if (numEl) {
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => { if (e.isIntersecting) { animateCount(numEl, days); obs.disconnect(); } });
    }, { threshold: 0.6 });
    io.observe(numEl);
  }

  const sec = el.querySelector('#secondary');
  sec && sec.addEventListener('click', () => {
    window.location.href = `mailto:${MAIL}?subject=` + encodeURIComponent('Question about ' + computed.bestFitPath);
  });

  // persistent next-step bar
  document.getElementById('stickyLabel').textContent = step.primary;
  const sb = document.getElementById('stickyBtn');
  sb.setAttribute('href', primaryHref);
  sb.textContent = step.primary;
  $sticky.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => $sticky.classList.add('is-shown'));

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- navigation ------------------------------------------------------------
let current = null;
function goto(id) {
  current = id;
  hideSticky(); // only the result screen shows the persistent CTA
  if (id === 'contact') showContact();
  else showQuestion(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function advance() {
  const flow = flowFor(answers.concern);
  const next = flow[flow.indexOf(current) + 1];
  stack.push(current);
  if (!next || next === 'result') return;
  goto(next);
}
$back.addEventListener('click', () => {
  if (!stack.length) return;
  goto(stack.pop());
});

// ===========================================================================
// CONCIERGE — proof of concept (?mode=chat)
// A conversational skin over the SAME engine. It only gathers answers; the
// tested assess() still routes and showResult() still renders. In this demo
// the "understanding" is keyword-based; the live version swaps in Claude via
// /api/wholesome-chat.js (see tools/wholesome/concierge-prompt.md for the
// guardrails). The deterministic engine is the safety net in both.
// ===========================================================================
const ACKS = ['Thank you for that.', 'That helps.', 'I appreciate you sharing that.', 'Got it — thank you.'];
const BOT_ASK = {
  concern: "To start — what's brought you in today? You can just tell me in your own words.",
  goal_scars: 'When you picture the change you most want, is it more the texture and how the skin feels, or the colour and how much it stands out?',
  goal_smp: 'What are you most hoping for with your scalp or hair?',
  goal_brows: 'What kind of brow result are you hoping for?',
  goal_unsure: "That's completely okay. What would feel most helpful to walk away with today?",
  timeline: 'Good to know. And where are you in all this — just starting to look into it, or closer to ready?',
  scar_heal: 'That helps. Roughly how long has the area been there, or been healing?',
  scar_state: 'And when you look at it now, how would you describe it?',
  scar_area: "Where on your body is it, if you're comfortable sharing?",
  smp_situation: 'How would you describe your hair or scalp right now?',
  smp_look: 'And the look you have in mind?',
  smp_prior: 'Have you had any hair restoration or scalp work before?',
  brow_fill: 'Do you fill your brows in day to day?',
  brow_prev: 'Have you had brow tattooing or microblading before?',
  brow_style: 'What style feels closest to what you want?',
  barrier: "One last, honest question — and there's genuinely no wrong answer. What's the thing that's really been holding you back?",
};
const SYN = {
  concern: { scars:['scar','stretch','mark','c-section','csection','surgery','surgical','burn','cut','wound'], smp:['hair','hairline','bald','thin','scalp','receding','density','crown','shave'], brows:['brow','eyebrow','microblad'], unsure:['not sure','unsure',"don't know",'dont know','no idea','guidance','help'] },
  goal_scars: { texture:['texture','raised','bumpy','feel','rough','indent','damage'], colour:['colour','color','red','white','dark','visible','contrast','stands out','discolour','discolor','tone'], both:['both','and colour','and color'], unsure:['not sure','dont know',"don't know",'no idea'] },
  timeline: { ready:['ready','soon','book','asap','now'], researching:['research','looking','browsing','info','learning','exploring','reading'], waiting:['wait','right time','later','someday','eventually'], event:['event','wedding','vacation','holiday','trip','summer','date coming'], unsure_ready:['not sure','unsure',"don't know",'dont know'] },
  scar_heal: { lt6:['less than 6','under 6','few months','couple months','recent','new','3 month','4 month','5 month'], '6to12':['6 to 12','6-12','half a year','8 month','9 month','10 month','under a year'], over1:['over a year','more than a year','year and','1 year','a year','13 month','18 month','two year','2 year'], several:['several','years ago','long time','many years','decade','5 year','ten year','childhood','since i was'], unsure:['not sure',"don't remember",'dont remember','no idea'] },
  scar_state: { flat:['flat','settled','smooth','healed','fine now','normal'], raised:['raised','bumpy','thick','keloid','lumpy'], indented:['indent','sunken','pitted','divot','depress'], changing:['red','pink','changing','still healing','fresh','purple'], sensitive:['sensitive','irritated','itchy','sore','painful','tender'], unsure:['not sure','dont know',"don't know"] },
  scar_area: { stomach:['stomach','belly','tummy','abdomen','c-section','csection'], hips_thighs:['hip','thigh','leg','buttock','bum'], arms:['arm','elbow','wrist','forearm'], chest_shoulders:['chest','shoulder','breast','collar'], surgical:['surgery','surgical','operation','incision'], injury:['injury','accident','burn','fall'], other:['other','face','neck','back','elsewhere'] },
  barrier: { natural:['natural','fake','look done','obvious','realistic','looks real'], hopeless:['nothing can be done','told','no hope','impossible','permanent','stuck','cant be',"can't be"], not_ready:['not ready','hesitant','scared','nervous'], self_conscious:['embarrass','self conscious','self-conscious','exposed','ashamed','shy','vulnerable','judge'], cost:['cost','price','money','afford','expensive','worth it','budget'], nothing:['nothing','ready','all good','lets go',"let's go",'excited','im good'] },
};

const chat = { flow: [], idx: 0, log: null, current: null, name: null, phase: 'q' };

function startConcierge() {
  $progress.classList.add('we-hidden');
  const el = paint(`
    <div class="we-chat">
      <div class="we-chat__log" id="clog"></div>
      <div class="we-chat__bar">
        <textarea class="we-chat__input" id="cin" rows="1" placeholder="Type your reply…"></textarea>
        <button class="we-chat__send" id="csend" aria-label="Send">→</button>
      </div>
      <p class="we-chat__note">Private concierge · a calm, unhurried conversation. Nothing here is shared without your say.</p>
    </div>`, 'we-chat-wrap');
  chat.log = el.querySelector('#clog');
  const input = el.querySelector('#cin');
  const submit = () => { const v = input.value.trim(); if (v) { input.value = ''; input.style.height = 'auto'; onUserText(v); } };
  el.querySelector('#csend').addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });
  input.focus();
  track('started', { utm_source: utmSource, mode: 'chat' });
  botSequence([
    "Hi — I'm really glad you're here. Take your time; there's no rush, and nothing you tell me is wrong.",
    BOT_ASK.concern,
  ], () => { chat.current = 'concern'; showSuggestions('concern'); });
}

function scrollLog() { chat.log.scrollTop = chat.log.scrollHeight; requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }
function addMsg(text, who) { const d = document.createElement('div'); d.className = 'we-msg we-msg--' + who; d.textContent = text; chat.log.appendChild(d); scrollLog(); return d; }
function typingDots() { const d = document.createElement('div'); d.className = 'we-typing'; d.innerHTML = '<span></span><span></span><span></span>'; chat.log.appendChild(d); scrollLog(); return d; }

// Play bot messages with a human-feeling typing pause between each.
function botSequence(msgs, done) {
  let i = 0;
  const step = () => {
    if (i >= msgs.length) { done && done(); return; }
    const t = typingDots();
    setTimeout(() => { t.remove(); addMsg(msgs[i], 'bot'); i += 1; setTimeout(step, 240); }, Math.min(1000, 460 + msgs[i].length * 6));
  };
  step();
}
function botSay(text, done) { botSequence([text], done); }

function showSuggestions(screenId) {
  const s = SCREENS[screenId]; if (!s) return;
  const old = chat.log.querySelector('.we-suggest'); if (old) old.remove();
  const wrap = document.createElement('div'); wrap.className = 'we-suggest';
  s.options.forEach(o => {
    const b = document.createElement('button'); b.textContent = o.label;
    b.addEventListener('click', () => { addMsg(o.label, 'user'); wrap.remove(); recordAnswer(screenId, o.id); });
    wrap.appendChild(b);
  });
  chat.log.appendChild(wrap); scrollLog();
}

function onUserText(text) {
  addMsg(text, 'user');
  const old = chat.log.querySelector('.we-suggest'); if (old) old.remove();
  if (chat.phase === 'name') { chat.name = (text.replace(/[^a-zA-Z' -]/g, '').trim().split(/\s+/)[0]) || text.trim(); askEmail(); return; }
  if (chat.phase === 'email') {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) { botSay("That doesn't look quite like an email — mind checking it?"); return; }
    chat.email = text.trim(); finishConcierge(); return;
  }
  const id = chat.current;
  const opt = matchOption(id, text);
  if (opt) recordAnswer(id, opt);
  else botSay('I want to be sure I hear you right — which of these feels closest?', () => showSuggestions(id));
}

function recordAnswer(screenId, optId) {
  answers[screenId] = optId;
  if (screenId === 'concern') { chat.flow = flowFor(optId).filter(x => x !== 'result'); chat.idx = chat.flow.indexOf('concern'); }
  advanceConcierge();
}

function advanceConcierge() {
  chat.idx += 1;
  const next = chat.flow[chat.idx];
  if (!next || next === 'contact') { askName(); return; }
  chat.current = next;
  botSequence([ACKS[chat.idx % ACKS.length], BOT_ASK[next] || SCREENS[next].question], () => showSuggestions(next));
}

function askName() { chat.phase = 'name'; botSay('Thank you for trusting me with all of that. Before I put your report together — what should I call you?'); }
function askEmail() { chat.phase = 'email'; botSay(`Lovely to meet you, ${chat.name}. And the best email to send your report to?`); }

async function finishConcierge() {
  chat.phase = 'done';
  const computed = assess(answers, { name: chat.name });
  botSay('Perfect. Give me one moment to put this together for you…');
  try {
    const r = await fetch('/api/wholesome-submit', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, responses: answers, computed, referrer, utm_source: utmSource }) });
    if (r.ok) { const j = await r.json(); submissionId = j.id; sessionId = j.session_id || sessionId; }
  } catch (_) {}
  try {
    await fetch('/api/wholesome-contact', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ submission_id: submissionId, first_name: chat.name, email: chat.email, phone: null, opt_in_sms: false }) });
  } catch (_) {}
  track('contact_submitted', { path: computed.bestFitPath, mode: 'chat' });
  track('completed', { path: computed.bestFitPath, stage: computed.readinessStage, mode: 'chat' });
  setTimeout(() => showResult(computed, chat.name), 1000);
}

// Demo "understanding": keyword match against the current screen's options.
// Live version replaces this with Claude (extraction + warmth), same output.
function matchOption(screenId, text) {
  const t = ' ' + text.toLowerCase() + ' ';
  const syn = SYN[screenId]; if (!syn) return null;
  const hits = [];
  for (const [id, kws] of Object.entries(syn)) { if (kws.some(k => t.includes(k))) hits.push(id); }
  if (!hits.length) return null;
  if (screenId === 'goal_scars' && hits.includes('texture') && hits.includes('colour')) return 'both';
  return hits[0];
}

// boot — tap flow by default; concierge on ?mode=chat
const mode = new URLSearchParams(location.search).get('mode');
if (mode === 'chat') startConcierge();
else showWelcome();
</script>
