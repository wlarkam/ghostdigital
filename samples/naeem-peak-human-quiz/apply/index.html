<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apply to Work With Naeem — Peak Human</title>
  <meta name="description" content="A short application. Three questions. We read every one.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/samples/naeem-peak-human-quiz/quiz.css">
  <style>
    /* Apply-page-only additions on top of the quiz tokens. */
    .apply__field { display: grid; gap: 8px; margin-bottom: 28px; }
    .apply__label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-2);
    }
    .apply__sublabel {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--fg-3);
      margin-top: -2px;
    }
    .apply__input,
    .apply__textarea {
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-elev);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-md);
      color: var(--fg-1);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
    }
    .apply__input::placeholder,
    .apply__textarea::placeholder { color: var(--fg-3); }
    .apply__input:focus,
    .apply__textarea:focus { outline: none; border-color: var(--accent); }
    .apply__textarea { min-height: 130px; }
    .apply__prefill-note {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .apply__prefill-note::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 999px;
    }
    .apply__radios { display: grid; gap: 10px; }
    .apply__radio {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-elev);
      border: 1px solid var(--rule);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--fg-1);
      transition: all 160ms var(--ease);
    }
    .apply__radio:hover { border-color: var(--accent-line); background: var(--bg-card); }
    .apply__radio input { accent-color: var(--accent); }
    .apply__radio.is-checked { border-color: var(--accent); background: var(--accent-soft); }
    .apply__archetype-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 10px;
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      color: var(--accent);
      margin-bottom: 18px;
    }
    .apply__hero { margin-bottom: 40px; }
    .apply__hero h1 { text-transform: uppercase; margin-bottom: 14px; }
    .apply__hero h1 em { color: var(--fg-3); }
    .apply__hero p { color: var(--fg-2); font-size: 17px; max-width: 600px; }
    .apply__submit { margin-top: 16px; }
    .apply__success {
      text-align: center;
      padding: 60px 24px;
    }
    .apply__success h2 {
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 18px;
    }
    .apply__success h2 em { color: var(--fg-3); }
    .apply__success p {
      font-family: var(--font-body);
      font-size: 17px;
      color: var(--fg-2);
      max-width: 520px;
      margin: 0 auto 14px;
    }
  </style>
</head>
<body>
  <div class="ribbon">Sample · Pitch artifact</div>
  <main id="app"></main>
  <script type="module" src="/samples/naeem-peak-human-quiz/apply/apply.js"></script>
  <noscript>
    <div style="max-width:640px;margin:80px auto;padding:0 24px;color:#F4EFE3;font-family:Inter,sans-serif;">
      <h1 style="font-family:Archivo,sans-serif;font-weight:900;text-transform:uppercase;">This page needs JavaScript.</h1>
    </div>
  </noscript>
</body>
</html>
